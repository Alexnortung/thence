name: Determinism

on:
  pull_request:
    paths:
      - spikes/determinism/**
      - .github/workflows/determinism.yml
  push:
    branches:
      - main
    paths:
      - spikes/determinism/**
      - .github/workflows/determinism.yml

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Check results against exact references
        run: pnpm run spike:determinism:check

      - name: Compare Node, Chromium, Firefox and WebKit
        run: pnpm run spike:determinism -- --out results-${{ matrix.os }}.json

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: determinism-${{ matrix.os }}
          path: spikes/determinism/results-*.json
